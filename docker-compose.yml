services:
  jidian:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jidian
    ports:
      - "127.0.0.1:4173:4173"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4173
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/api/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
